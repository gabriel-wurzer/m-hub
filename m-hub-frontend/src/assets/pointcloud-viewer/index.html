<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>m-Hub Punktwolken-Viewer</title>
    <style>
      html, body { margin: 0; height: 100%; background: #101114; color: #cdd3dc;
        font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
      #viewer { position: fixed; inset: 0; }
      #title { position: fixed; left: 14px; top: 12px; font-weight: 600; letter-spacing: .2px; }
      #status { position: fixed; left: 14px; bottom: 12px; background: rgba(16,17,20,.82);
        padding: 6px 10px; border-radius: 6px; font-size: 13px; }
      #controls { position: fixed; right: 14px; top: 12px; background: rgba(16,17,20,.82);
        padding: 10px 12px; border-radius: 8px; font-size: 13px; }
      #controls label { display: block; margin-bottom: 5px; }
      input[type=range] { width: 170px; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js",
          "three/addons/": "./vendor/addons/"
        }
      }
    </script>
  </head>
  <body>
    <div id="viewer"></div>
    <div id="title">m-Hub Punktwolken-Viewer</div>
    <div id="controls">
      <label>Punktgröße <output id="sizeVal">0.020</output></label>
      <input id="pointSize" type="range" min="0.001" max="0.2" step="0.001" value="0.02" />
    </div>
    <div id="status">Bereit.</div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
